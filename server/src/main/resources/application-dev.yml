# 开发环境
app:
  env: dev
  # 账号全部来自数据库（sys_staff.username / customer.phone），不再向进程内仓储灌种子
  # 演示数据生成器：非生产 profile + 该开关为 true 时，才在启动时灌入半年量级演示数据
  # （200 客户 / ~2000 订单 / 会话 / 退款…）。
  # 默认关闭：清了测试数据后，重启不应该再把演示数据灌回来。
  #   需要重新造一批演示数据时（演示、截图、压测），单次启动带上开关即可：
  #     java -jar sent-server.jar --app.demo-data.enabled=true
  #   或设置环境变量 APP_DEMO_DATA_ENABLED=true。
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
    # 规模档位：
    #   full（默认）= 收口阶段那套演示数据（150 个人 + 50 企业客户、2000 单），用于演示 / 截图；
    #   tiny        = E2E 专用最小集（10 个人 + 3 企业客户、50 单、6 个会话），
    #                 客户过一页、热销榜 5 个 SKU、复购三档、1 个低库存 SKU、1 份过期合同。
    # 跑 E2E 前：--app.demo-data.enabled=true --app.demo-data.scale=tiny
    scale: ${APP_DEMO_DATA_SCALE:full}
  sms:
    # 演示开关：true 时把验证码回显到 /auth/sms-code 响应，供前端在浏览器控制台打印。
    # 仅 dev 开启；prod 不设此值（默认 false），验证码绝不回显，避免泄露。
    expose-demo-code: true

spring:
  flyway:
    # 本地 dev 库历史上改过 V5 迁移文件，校验和不匹配会阻断启动；
    # 仅关闭本机开发库校验，CI / test 库仍保持严格校验。
    validate-on-migrate: false
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/sent_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 123456 仅为本机 MySQL 的演示用假口令，不是任何真实环境凭证；
    # 换机请用 DB_PASSWORD 环境变量覆盖，切勿把真密码提交到仓库。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
