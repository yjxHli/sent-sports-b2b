# 测试环境（CI 集成测试使用，一般由 Testcontainers 注入真实连接）
app:
  env: test
  # 账号全部来自数据库（测试自行插行），不再使用进程内种子仓储
  # 测试上下文严禁触发演示数据生成器（避免污染 IT 隔离 / 拖慢启动）
  demo-data:
    enabled: false
  pay:
    # 集成测试要用固定密钥自签一份「渠道通知」再打回接口——随机密钥会让验签永远失败。
    # 仅测试 profile 固定；dev/prod 仍走 PAY_MOCK_SECRET（prod 未注入则启动失败）。
    mock-secret: ${PAY_MOCK_SECRET:test-only-fixture-secret}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sent_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 与 dev 一致：仅为本机集成测试库的演示用假口令，CI 请用 DB_PASSWORD 注入。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
